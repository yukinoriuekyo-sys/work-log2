```html
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Work Log</title>


    <style>

        /* ==============================
           基本設定
        ============================== */

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 20px;
            background: #f3f4f6;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            color: #222;
        }

        .container {
            max-width: 700px;
            margin: 0 auto;
        }

        h1 {
            font-size: 24px;
            margin-bottom: 20px;
        }


        /* ==============================
           入力項目
        ============================== */

        .entry {
            background: white;
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 12px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
        }

        .row {
            display: flex;
            gap: 10px;
            align-items: center;
            flex-wrap: wrap;
        }

        select,
        input {
            font-size: 16px;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 8px;
            background: white;
        }

        .type-select {
            flex: 1;
            min-width: 180px;
        }

        input[type="time"] {
            min-width: 125px;
        }

        input[type="number"] {
            width: 130px;
        }

        .label {
            font-size: 13px;
            color: #666;
            margin: 8px 0 4px;
        }


        /* ==============================
           ボタン
        ============================== */

        button {
            border: none;
            border-radius: 8px;
            padding: 11px 16px;
            font-size: 15px;
            cursor: pointer;
        }

        .copy-btn {
            width: 100%;
            background: #2563eb;
            color: white;
            font-size: 18px;
            padding: 15px;
            margin-top: 10px;
        }

        .copy-btn:hover {
            background: #1d4ed8;
        }

        .add-btn {
            background: #16a34a;
            color: white;
        }

        .delete-btn {
            background: #fee2e2;
            color: #dc2626;
            padding: 8px 11px;
        }


        /* ==============================
           出力欄
        ============================== */

        .output {
            margin-top: 20px;
            background: #111827;
            color: #f9fafb;
            border-radius: 10px;
            padding: 15px;
            white-space: pre-wrap;
            min-height: 70px;
            font-family: monospace;
        }


        /* ==============================
           Time / Weight 切り替え
        ============================== */

        .mode {
            display: flex;
            gap: 6px;
            margin-top: 12px;
        }

        .mode button {
            background: #e5e7eb;
        }

        .mode button.active {
            background: #2563eb;
            color: white;
        }


        /* ==============================
           Time入力
        ============================== */

        .time-fields {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-top: 10px;
        }

        .time-fields > div {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .time-fields .label {
            width: 55px;
            margin: 0;
        }


        /* ==============================
           Weight入力
        ============================== */

        .weight-fields {
            display: none;
            flex-direction: column;
            gap: 10px;
            margin-top: 10px;
        }

        .entry.weight-mode .time-fields {
            display: none;
        }

        .entry.weight-mode .weight-fields {
            display: flex;
        }

        .material-row {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        .material-name {
            width: 180px;
            font-size: 16px;
        }

        .material-input {
            width: 130px;
        }


        /* ==============================
           スマートフォン用
        ============================== */

        @media (max-width: 500px) {

            body {
                padding: 12px;
            }

            .row {
                flex-direction: column;
                align-items: stretch;
            }

            .type-select,
            input[type="time"],
            input[type="number"] {
                width: 100%;
            }

            .delete-btn {
                align-self: flex-end;
            }

            .time-fields > div {
                align-items: stretch;
            }

            .material-name {
                width: 100%;
            }

            .material-input {
                width: calc(100% - 30px);
            }

        }

    </style>

</head>


<body>

    <div class="container">

        <h1>Work Log</h1>

        <!-- 入力項目 -->
        <div id="entries"></div>

        <!-- 項目を追加 -->
        <button class="add-btn" onclick="addEntry()">
            ＋ Add item
        </button>

        <!-- コピー -->
        <button class="copy-btn" onclick="copyText()">
            📋 Copy
        </button>

        <!-- コピー内容 -->
        <div class="output" id="output">
            Your copied text will appear here.
        </div>

    </div>


    <script>

        /* ==================================================
           初期データ
        ================================================== */

        const defaultTypes = [

            "Sanding time",
            "Putty apply time",
            "Paint apply time",
            "PBU apply time",
            "-",
            "-",
            "-",
            "-",
            "Material weight",
            "Other"

        ];


        /* ==================================================
           Material weight の5種類

           今後材料を増やす場合はここに追加
        ================================================== */

        const weightTypes = [

            "Top cort12",
            "Top cort12 hardner",
            "Top cort12 thinner",
            "Filler5",
            "Filler5 hardner"

        ];


        /* ==================================================
           材料の配合比率

           基準材料を4として計算

           Top cort12
           4 : 1 : 0.5

           Filler5
           4 : 1
        ================================================== */

        const materialRatios = {

            "Top cort12": {

                base: 4,

                components: {

                    "Top cort12 hardner": 1,
                    "Top cort12 thinner": 0.5

                }

            },


            "Filler5": {

                base: 4,

                components: {

                    "Filler5 hardner": 1

                }

            }

        };


        /* ==================================================
           保存データ
        ================================================== */

        let types =
            JSON.parse(
                localStorage.getItem("workLogTypes")
            ) || defaultTypes;


        const entries =
            document.getElementById("entries");


        /* ==================================================
           新しい入力項目を追加
        ================================================== */

        function addEntry() {

            const entry =
                document.createElement("div");

            entry.className = "entry";


            entry.innerHTML = `

                <div class="row">

                    <select
                        class="type-select"
                        onchange="typeChanged(this)"
                    >

                        ${types
                            .map(type => `

                                <option value="${escapeHtml(type)}">
                                    ${escapeHtml(type)}
                                </option>

                            `)
                            .join("")}

                    </select>


                    <button
                        class="delete-btn"
                        onclick="
                            this.closest('.entry').remove();
                            updateOutput();
                        "
                    >
                        ✕
                    </button>

                </div>


                <div class="mode">

                    <button
                        class="time-mode active"
                        onclick="setMode(this, 'time')"
                    >
                        Time
                    </button>


                    <button
                        class="weight-mode-btn"
                        onclick="setMode(this, 'weight')"
                    >
                        Weight
                    </button>

                </div>


                <!-- Time入力 -->

                <div class="time-fields">

                    <div>

                        <div class="label">
                            Start
                        </div>

                        <input
                            type="time"
                            class="start-time"
                            onchange="updateOutput()"
                        >

                    </div>


                    <div>

                        <div class="label">
                            Finish
                        </div>

                        <input
                            type="time"
                            class="finish-time"
                            onchange="updateOutput()"
                        >

                    </div>

                </div>


                <!-- Weight入力 -->

                <div class="weight-fields">

                    ${weightTypes
                        .map(type => `

                            <div class="material-row">

                                <span class="material-name">
                                    ${escapeHtml(type)}
                                </span>

                                <input
                                    type="number"
                                    class="material-input"
                                    data-material="${escapeHtml(type)}"
                                    placeholder="Weight"
                                    step="0.1"
                                    min="0"
                                    oninput="materialInputChanged(this)"
                                >

                                <span>g</span>

                            </div>

                        `)
                        .join("")}

                </div>

            `;


            entries.appendChild(entry);

            updateOutput();

        }


        /* ==================================================
           Time / Weight モード切り替え
        ================================================== */

        function setMode(button, mode) {

            const entry =
                button.closest(".entry");


            const timeButton =
                entry.querySelector(".time-mode");


            const weightButton =
                entry.querySelector(".weight-mode-btn");


            if (mode === "time") {

                entry.classList.remove("weight-mode");

                timeButton.classList.add("active");

                weightButton.classList.remove("active");

            } else {

                entry.classList.add("weight-mode");

                timeButton.classList.remove("active");

                weightButton.classList.add("active");

            }


            updateOutput();

        }


        /* ==================================================
           項目変更時
        ================================================== */

        function typeChanged(select) {

            const entry =
                select.closest(".entry");


            const value =
                select.value.toLowerCase();


            /*
               Material weightの場合、
               自動的にWeightへ切り替え
            */

            if (
                value.includes("weight") ||
                value.includes("material") ||
                value.includes("gram")
            ) {

                setMode(
                    entry.querySelector(".weight-mode-btn"),
                    "weight"
                );

            } else {

                setMode(
                    entry.querySelector(".time-mode"),
                    "time"
                );

            }

        }


        /* ==================================================
           材料重量入力時
        ================================================== */

        function materialInputChanged(input) {

            const entry =
                input.closest(".entry");


            const material =
                input.dataset.material;


            const value =
                parseFloat(input.value);


            /*
               配合比率が設定されている材料なら
               関連材料を自動計算
            */

            if (
                materialRatios[material] &&
                !isNaN(value)
            ) {

                const ratio =
                    materialRatios[material];


                Object.entries(
                    ratio.components
                ).forEach(
                    ([component, componentRatio]) => {

                        const componentInput =
                            entry.querySelector(
                                `[data-material="${component}"]`
                            );


                        if (!componentInput) {
                            return;
                        }


                        const calculated =
                            value *
                            componentRatio /
                            ratio.base;


                        componentInput.value =
                            Number(
                                calculated.toFixed(3)
                            );

                    }
                );

            }


            updateOutput();

        }


        /* ==================================================
           時刻を変換
           
           例：
           10:20 → 10:20am
        ================================================== */

        function formatTime(time) {

            if (!time) {
                return "";
            }


            const [
                hourString,
                minute
            ] =
                time.split(":");


            let hour =
                parseInt(hourString);


            const ampm =
                hour >= 12
                    ? "pm"
                    : "am";


            hour =
                hour % 12;


            if (hour === 0) {
                hour = 12;
            }


            return `${hour}:${minute}${ampm}`;

        }


        /* ==================================================
           Weight出力
        ================================================== */

        function getWeightOutput(entry) {

            const lines = [];


            weightTypes.forEach(material => {

                const input =
                    entry.querySelector(
                        `[data-material="${material}"]`
                    );


                if (!input) {
                    return;
                }


                const value =
                    parseFloat(input.value);


                /*
                   0g、未入力は表示しない
                */

                if (
                    isNaN(value) ||
                    value <= 0
                ) {
                    return;
                }


                lines.push(
                    `${material}\n${formatWeight(value)}g`
                );

            });


            return lines.join("\n");

        }


        /* ==================================================
           重量表示の小数処理
        ================================================== */

        function formatWeight(value) {

            /*
               100.000 → 100
               25.000 → 25
               12.500 → 12.5
            */

            return Number(
                value.toFixed(3)
            ).toString();

        }


        /* ==================================================
           コピー用テキストを作成
        ================================================== */

        function updateOutput() {

            const allEntries =
                document.querySelectorAll(".entry");


            const lines = [];


            allEntries.forEach(entry => {

                const type =
                    entry.querySelector(
                        ".type-select"
                    ).value;


                /* ------------------------------
                   Weight
                ------------------------------ */

                if (
                    entry.classList.contains(
                        "weight-mode"
                    )
                ) {

                    const weightOutput =
                        getWeightOutput(entry);


                    /*
                       Material weightを選択していても
                       全部0gなら何も出力しない
                    */

                    if (weightOutput) {

                        lines.push(
                            `${type}\n${weightOutput}`
                        );

                    }


                    return;

                }


                /* ------------------------------
                   Time
                ------------------------------ */

                const start =
                    entry.querySelector(
                        ".start-time"
                    ).value;


                const finish =
                    entry.querySelector(
                        ".finish-time"
                    ).value;


                if (
                    start &&
                    finish
                ) {

                    lines.push(

                        `${type}\n` +
                        `start ${formatTime(start)}\n` +
                        `finish ${formatTime(finish)}`

                    );

                }

                else if (start) {

                    lines.push(

                        `${type}\n` +
                        `start ${formatTime(start)}`

                    );

                }

                else if (finish) {

                    lines.push(

                        `${type}\n` +
                        `finish ${formatTime(finish)}`

                    );

                }

            });


            document.getElementById(
                "output"
            ).textContent =

                lines.length
                    ? lines.join("\n\n")
                    : "Your copied text will appear here.";

        }


        /* ==================================================
           コピー
        ================================================== */

        async function copyText() {

            updateOutput();


            const text =
                document.getElementById(
                    "output"
                ).textContent;


            if (
                !text ||
                text ===
                "Your copied text will appear here."
            ) {

                return;

            }


            try {

                await navigator.clipboard.writeText(
                    text
                );


                const button =
                    document.querySelector(
                        ".copy-btn"
                    );


                const original =
                    button.textContent;


                button.textContent =
                    "✓ Copied!";


                setTimeout(() => {

                    button.textContent =
                        original;

                }, 1200);


            }

            catch (error) {

                alert(
                    "Copy failed. Please select and copy the text manually."
                );

            }

        }


        /* ==================================================
           HTML特殊文字対策
        ================================================== */

        function escapeHtml(text) {

            const div =
                document.createElement(
                    "div"
                );


            div.textContent =
                text;


            return div.innerHTML;

        }


        /* ==================================================
           最初の1行を表示
        ================================================== */

        addEntry();

    </script>

</body>

</html>
