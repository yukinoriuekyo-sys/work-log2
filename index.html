<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Work Log</title>


    <style>

        /* ==============================
           基本設定
        ============================== */

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 20px;
            background: #f3f4f6;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            color: #222;
        }

        .container {
            max-width: 700px;
            margin: 0 auto;
        }

        h1 {
            font-size: 24px;
            margin-bottom: 20px;
        }


        /* ==============================
           入力項目
        ============================== */

        .entry {
            background: white;
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 12px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
        }

        .row {
            display: flex;
            gap: 10px;
            align-items: center;
            flex-wrap: wrap;
        }

        select,
        input {
            font-size: 16px;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 8px;
            background: white;
        }

        .type-select {
            flex: 1;
            min-width: 180px;
        }

        input[type="time"] {
            min-width: 125px;
        }

        input[type="number"] {
            width: 130px;
        }

        .label {
            font-size: 13px;
            color: #666;
            margin: 8px 0 4px;
        }


        /* ==============================
           ボタン
        ============================== */

        button {
            border: none;
            border-radius: 8px;
            padding: 11px 16px;
            font-size: 15px;
            cursor: pointer;
        }

        .copy-btn {
            width: 100%;
            background: #2563eb;
            color: white;
            font-size: 18px;
            padding: 15px;
            margin-top: 10px;
        }

        .copy-btn:hover {
            background: #1d4ed8;
        }

        .add-btn {
            background: #16a34a;
            color: white;
        }

        .delete-btn {
            background: #fee2e2;
            color: #dc2626;
            padding: 8px 11px;
        }

        .clear-btn {
            width: 100%;
            background: #6b7280;
            color: white;
            margin-top: 10px;
        }

        .clear-btn:hover {
            background: #4b5563;
        }


        /* ==============================
           出力欄
        ============================== */

        .output {
            margin-top: 20px;
            background: #111827;
            color: #f9fafb;
            border-radius: 10px;
            padding: 15px;
            white-space: pre-wrap;
            min-height: 70px;
            font-family: monospace;
        }


        /* ==============================
           Time / Weight 切り替え
        ============================== */

        .mode {
            display: flex;
            gap: 6px;
            margin-top: 12px;
        }

        .mode button {
            background: #e5e7eb;
        }

        .mode button.active {
            background: #2563eb;
            color: white;
        }


        /* ==============================
           Time入力
        ============================== */

        .time-fields {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-top: 10px;
        }

        .time-fields > div {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .time-fields .label {
            width: 55px;
            margin: 0;
        }


        /* ==============================
           Weight入力
        ============================== */

        .weight-fields {
            display: none;
            flex-direction: column;
            gap: 10px;
            margin-top: 10px;
        }

        .entry.weight-mode .time-fields {
            display: none;
        }

        .entry.weight-mode .weight-fields {
            display: flex;
        }

        .material-row {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        .material-name {
            width: 180px;
            font-size: 16px;
        }

        .material-input {
            width: 130px;
        }


        /* ==============================
           スマートフォン用
        ============================== */

        @media (max-width: 500px) {

            body {
                padding: 12px;
            }

            .row {
                flex-direction: column;
                align-items: stretch;
            }

            .type-select,
            input[type="time"],
            input[type="number"] {
                width: 100%;
            }

            .delete-btn {
                align-self: flex-end;
            }

            .time-fields > div {
                align-items: stretch;
            }

            .material-name {
                width: 100%;
            }

            .material-input {
                width: calc(100% - 30px);
            }

        }

    </style>

</head>


<body>

    <div class="container">

        <h1>Work Log</h1>


        <!-- ==========================================
             入力項目
        =========================================== -->

        <div id="entries"></div>


        <!-- ==========================================
             項目追加
        =========================================== -->

        <button
            class="add-btn"
            onclick="addEntry()"
        >
            ＋ Add item
        </button>


        <!-- ==========================================
             コピー
        =========================================== -->

        <button
            class="copy-btn"
            onclick="copyText()"
        >
            📋 Copy
        </button>


        <!-- ==========================================
             保存データ削除
        =========================================== -->

        <button
            class="clear-btn"
            onclick="clearSavedData()"
        >
            🗑 Clear saved data
        </button>


        <!-- ==========================================
             コピー内容
        =========================================== -->

        <div
            class="output"
            id="output"
        >
            Your copied text will appear here.
        </div>

    </div>


    <script>


        /* ==================================================
           作業項目
        ================================================== */

        const defaultTypes = [

            "Sanding time",
            "Putty apply time",
            "Paint apply time",
            "PBU apply time",
            "Putty sanding time",
            "LEP10 apply time",
            "Re sanding",
            "-",
            "-",
            "Other"

        ];


        /* ==================================================
           Material weight の種類

           材料を追加するときは
           この配列に追加するだけ
        ================================================== */

        const weightTypes = [

            "Topcoat12",
            "Topcoat12 hardener",
            "Topcoat12 thinner",
            "Filler5",
            "Filler5 hardner"

        ];


        /* ==================================================
           材料の配合比率

           Topcoat12
           4 : 1 : 0.5

           Filler5
           4 : 1
        ================================================== */

        const materialRatios = {

            "Topcoat12": {

                base: 4,

                components: {

                    "Topcoat12 hardener": 1,
                    "Topcoat12 thinner": 0.5

                }

            },


            "Filler5": {

                base: 4,

                components: {

                    "Filler5 hardner": 1

                }

            }

        };


        /* ==================================================
           LocalStorage 保存キー
        ================================================== */

        const DATA_SAVE_KEY =
            "workLogCurrentData";


        /* ==================================================
           DOM
        ================================================== */

        const entries =
            document.getElementById("entries");


        /* ==================================================
           作業項目一覧
        ================================================== */

        let types = defaultTypes;


        /* ==================================================
           新しい入力項目を追加
        ================================================== */

        function addEntry(savedData = null) {

            const entry =
                document.createElement("div");


            entry.className =
                "entry";


            entry.innerHTML = `

                <!-- ==========================
                     項目選択
                =========================== -->

                <div class="row">

                    <select
                        class="type-select"
                        onchange="typeChanged(this)"
                    >

                        ${types
                            .map(type => `

                                <option
                                    value="${escapeHtml(type)}"
                                >
                                    ${escapeHtml(type)}
                                </option>

                            `)
                            .join("")}

                    </select>


                    <button
                        class="delete-btn"
                        onclick="deleteEntry(this)"
                    >
                        ✕
                    </button>

                </div>


                <!-- ==========================
                     Time / Weight
                =========================== -->

                <div class="mode">

                    <button
                        type="button"
                        class="time-mode active"
                        onclick="setMode(this, 'time')"
                    >
                        Time
                    </button>


                    <button
                        type="button"
                        class="weight-mode-btn"
                        onclick="setMode(this, 'weight')"
                    >
                        Weight
                    </button>

                </div>


                <!-- ==========================
                     Time入力
                =========================== -->

                <div class="time-fields">

                    <div>

                        <div class="label">
                            Start
                        </div>

                        <input
                            type="time"
                            class="start-time"
                            oninput="inputChanged()"
                        >

                    </div>


                    <div>

                        <div class="label">
                            Finish
                        </div>

                        <input
                            type="time"
                            class="finish-time"
                            oninput="inputChanged()"
                        >

                    </div>

                </div>


                <!-- ==========================
                     Weight入力
                =========================== -->

                <div class="weight-fields">

                    ${weightTypes
                        .map(type => `

                            <div class="material-row">

                                <span class="material-name">
                                    ${escapeHtml(type)}
                                </span>


                                <input
                                    type="number"
                                    class="material-input"
                                    data-material="${escapeHtml(type)}"
                                    placeholder="Weight"
                                    step="0.1"
                                    min="0"
                                    oninput="materialInputChanged(this)"
                                >


                                <span>
                                    g
                                </span>

                            </div>

                        `)
                        .join("")}

                </div>

            `;


            entries.appendChild(entry);


            /* ==================================================
               保存データがある場合
            ================================================== */

            if (savedData) {

                const select =
                    entry.querySelector(
                        ".type-select"
                    );


                /* ------------------------------
                   項目
                ------------------------------ */

                if (savedData.type) {

                    const optionExists =
                        Array.from(
                            select.options
                        ).some(
                            option =>
                                option.value === savedData.type
                        );


                    if (optionExists) {

                        select.value =
                            savedData.type;

                    }

                }


                /* ------------------------------
                   Start
                ------------------------------ */

                const start =
                    entry.querySelector(
                        ".start-time"
                    );


                if (savedData.start) {

                    start.value =
                        savedData.start;

                }


                /* ------------------------------
                   Finish
                ------------------------------ */

                const finish =
                    entry.querySelector(
                        ".finish-time"
                    );


                if (savedData.finish) {

                    finish.value =
                        savedData.finish;

                }


                /* ------------------------------
                   Weight
                ------------------------------ */

                if (
                    savedData.mode ===
                    "weight"
                ) {

                    setMode(

                        entry.querySelector(
                            ".weight-mode-btn"
                        ),

                        "weight",

                        false

                    );

                }


                /* ------------------------------
                   材料重量
                ------------------------------ */

                if (
                    savedData.materials
                ) {

                    Object.entries(
                        savedData.materials
                    ).forEach(
                        ([material, value]) => {

                            const input =
                                entry.querySelector(
                                    `[data-material="${escapeHtml(material)}"]`
                                );


                            if (input) {

                                input.value =
                                    value;

                            }

                        }
                    );

                }

            }


            updateOutput();

        }


        /* ==================================================
           入力変更
        ================================================== */

        function inputChanged() {

            updateOutput();

            saveCurrentData();

        }


        /* ==================================================
           項目削除
        ================================================== */

        function deleteEntry(button) {

            const entry =
                button.closest(".entry");


            if (entry) {

                entry.remove();

            }


            updateOutput();

            saveCurrentData();

        }


        /* ==================================================
           Time / Weight 切り替え
        ================================================== */

        function setMode(
            button,
            mode,
            shouldSave = true
        ) {

            const entry =
                button.closest(".entry");


            const timeButton =
                entry.querySelector(
                    ".time-mode"
                );


            const weightButton =
                entry.querySelector(
                    ".weight-mode-btn"
                );


            if (mode === "time") {

                entry.classList.remove(
                    "weight-mode"
                );


                timeButton.classList.add(
                    "active"
                );


                weightButton.classList.remove(
                    "active"
                );

            }

            else {

                entry.classList.add(
                    "weight-mode"
                );


                timeButton.classList.remove(
                    "active"
                );


                weightButton.classList.add(
                    "active"
                );

            }


            updateOutput();


            if (shouldSave) {

                saveCurrentData();

            }

        }


        /* ==================================================
           項目変更
        ================================================== */

        function typeChanged(select) {

            const value =
                select.value.toLowerCase();


            const entry =
                select.closest(".entry");


            /*
               Material weightの場合
               自動的にWeightへ変更
            */

            if (

                value.includes("weight") ||
                value.includes("material") ||
                value.includes("gram")

            ) {

                setMode(

                    entry.querySelector(
                        ".weight-mode-btn"
                    ),

                    "weight"

                );

            }

            else {

                setMode(

                    entry.querySelector(
                        ".time-mode"
                    ),

                    "time"

                );

            }


            updateOutput();

            saveCurrentData();

        }


        /* ==================================================
           材料重量入力
        ================================================== */

        function materialInputChanged(input) {

            const entry =
                input.closest(".entry");


            const material =
                input.dataset.material;


            const value =
                parseFloat(input.value);


            /* ------------------------------------------
               配合比率がある材料
            ------------------------------------------ */

            if (

                materialRatios[material] &&
                !isNaN(value)

            ) {

                const ratio =
                    materialRatios[material];


                Object.entries(
                    ratio.components
                ).forEach(
                    ([component, componentRatio]) => {


                        const componentInput =
                            entry.querySelector(
                                `[data-material="${escapeHtml(component)}"]`
                            );


                        if (!componentInput) {
                            return;
                        }


                        const calculated =
                            value *
                            componentRatio /
                            ratio.base;


                        componentInput.value =
                            Number(
                                calculated.toFixed(3)
                            );

                    }
                );

            }


            updateOutput();

            saveCurrentData();

        }


        /* ==================================================
           時刻フォーマット
        ================================================== */

        function formatTime(time) {

            if (!time) {

                return "";

            }


            const parts =
                time.split(":");


            const hourString =
                parts[0];


            const minute =
                parts[1];


            let hour =
                parseInt(hourString, 10);


            const ampm =
                hour >= 12
                    ? "pm"
                    : "am";


            hour =
                hour % 12;


            if (hour === 0) {

                hour = 12;

            }


            return `${hour}:${minute}${ampm}`;

        }


        /* ==================================================
           Weight出力
        ================================================== */

        function getWeightOutput(entry) {

            const lines = [];


            weightTypes.forEach(
                material => {

                    const input =
                        entry.querySelector(
                            `[data-material="${escapeHtml(material)}"]`
                        );


                    if (!input) {

                        return;

                    }


                    const value =
                        parseFloat(input.value);


                    /*
                       0g、未入力は表示しない
                    */

                    if (

                        isNaN(value) ||
                        value <= 0

                    ) {

                        return;

                    }


                    lines.push(

                        `${material}\n` +
                        `${formatWeight(value)}g`

                    );

                }
            );


            return lines.join("\n");

        }


        /* ==================================================
           重量の小数処理
        ================================================== */

        function formatWeight(value) {

            return Number(
                value.toFixed(3)
            ).toString();

        }


        /* ==================================================
           出力更新
        ================================================== */

        function updateOutput() {

            const allEntries =
                document.querySelectorAll(
                    ".entry"
                );


            const lines = [];


            allEntries.forEach(
                entry => {


                    const select =
                        entry.querySelector(
                            ".type-select"
                        );


                    if (!select) {

                        return;

                    }


                    const type =
                        select.value;


                    /* ==========================
                       Weight
                    =========================== */

                    if (

                        entry.classList.contains(
                            "weight-mode"
                        )

                    ) {

                        const weightOutput =
                            getWeightOutput(
                                entry
                            );


                        /*
                           重量が入力されている場合だけ
                           出力
                        */

                        if (weightOutput) {

                            lines.push(

                                `${type}\n` +
                                weightOutput

                            );

                        }


                        return;

                    }


                    /* ==========================
                       Time
                    =========================== */

                    const start =
                        entry.querySelector(
                            ".start-time"
                        ).value;


                    const finish =
                        entry.querySelector(
                            ".finish-time"
                        ).value;


                    if (
                        start &&
                        finish
                    ) {

                        lines.push(

                            `${type}\n` +
                            `start ${formatTime(start)}\n` +
                            `finish ${formatTime(finish)}`

                        );

                    }

                    else if (start) {

                        lines.push(

                            `${type}\n` +
                            `start ${formatTime(start)}`

                        );

                    }

                    else if (finish) {

                        lines.push(

                            `${type}\n` +
                            `finish ${formatTime(finish)}`

                        );

                    }

                }
            );


            document.getElementById(
                "output"
            ).textContent =

                lines.length

                    ? lines.join("\n\n")

                    : "Your copied text will appear here.";

        }


        /* ==================================================
           現在の状態を保存
        ================================================== */

        function saveCurrentData() {

            const savedEntries = [];


            document
                .querySelectorAll(".entry")
                .forEach(
                    entry => {


                        const select =
                            entry.querySelector(
                                ".type-select"
                            );


                        const start =
                            entry.querySelector(
                                ".start-time"
                            );


                        const finish =
                            entry.querySelector(
                                ".finish-time"
                            );


                        if (
                            !select ||
                            !start ||
                            !finish
                        ) {

                            return;

                        }


                        const mode =
                            entry.classList.contains(
                                "weight-mode"
                            )
                                ? "weight"
                                : "time";


                        const materials = {};


                        entry
                            .querySelectorAll(
                                ".material-input"
                            )
                            .forEach(
                                input => {

                                    materials[
                                        input.dataset.material
                                    ] =
                                        input.value;

                                }
                            );


                        savedEntries.push({

                            type:
                                select.value,

                            mode:
                                mode,

                            start:
                                start.value,

                            finish:
                                finish.value,

                            materials:
                                materials

                        });

                    }
                );


            localStorage.setItem(

                DATA_SAVE_KEY,

                JSON.stringify(
                    savedEntries
                )

            );

        }


        /* ==================================================
           保存データを復元
        ================================================== */

        function loadSavedData() {

            const saved =
                localStorage.getItem(
                    DATA_SAVE_KEY
                );


            /* ------------------------------------------
               保存データなし
            ------------------------------------------ */

            if (!saved) {

                addEntry();

                return;

            }


            try {

                const savedEntries =
                    JSON.parse(saved);


                if (

                    !Array.isArray(
                        savedEntries
                    ) ||

                    savedEntries.length === 0

                ) {

                    addEntry();

                    return;

                }


                savedEntries.forEach(
                    savedEntry => {

                        addEntry(
                            savedEntry
                        );

                    }
                );


                updateOutput();

            }

            catch (error) {

                console.error(
                    "保存データの読み込みに失敗しました。",
                    error
                );


                localStorage.removeItem(
                    DATA_SAVE_KEY
                );


                addEntry();

            }

        }


        /* ==================================================
           保存データをクリア
        ================================================== */

        function clearSavedData() {

            const result =
                confirm(

                    "保存されている作業データをすべて削除しますか？"

                );


            if (!result) {

                return;

            }


            /* 保存データ削除 */

            localStorage.removeItem(
                DATA_SAVE_KEY
            );


            /* 画面を空にする */

            entries.innerHTML = "";


            /* 新しい1行を作る */

            addEntry();


            updateOutput();

        }


        /* ==================================================
           コピー
        ================================================== */

        async function copyText() {

            updateOutput();


            const text =
                document.getElementById(
                    "output"
                ).textContent;


            if (

                !text ||

                text ===
                "Your copied text will appear here."

            ) {

                return;

            }


            try {

                await navigator.clipboard.writeText(
                    text
                );


                const button =
                    document.querySelector(
                        ".copy-btn"
                    );


                const original =
                    button.textContent;


                button.textContent =
                    "✓ Copied!";


                setTimeout(
                    () => {

                        button.textContent =
                            original;

                    },
                    1200
                );

            }

            catch (error) {

                alert(

                    "Copy failed. Please select and copy the text manually."

                );

            }

        }


        /* ==================================================
           HTML特殊文字対策
        ================================================== */

        function escapeHtml(text) {

            const div =
                document.createElement(
                    "div"
                );


            div.textContent =
                text;


            return div.innerHTML;

        }


        /* ==================================================
           ページ開始
        ================================================== */

        loadSavedData();


    </script>

</body>

</html>
```
